---
- name: Create Alertmanager directory
  ansible.builtin.file:
    path: /opt/monitoring/alertmanager
    state: directory
    owner: root
    group: docker
    mode: "0775"

- name: Deploy Alertmanager config
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: /opt/monitoring/alertmanager/alertmanager.yml
    owner: root
    group: "65534"
    mode: "0640"
  notify: Restart Alertmanager
  no_log: true

- name: Deploy Alertmanager compose
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/monitoring/alertmanager/compose.yml
    owner: root
    group: docker
    mode: "0644"
  notify: Restart Alertmanager

- name: Start Alertmanager
  community.docker.docker_compose_v2:
    project_src: /opt/monitoring/alertmanager
    state: present
    pull: missing
